name: Zapier Integration Validation

on:
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - id: checkout
      name: Checkout repo
      uses: actions/checkout@v4
    
    - id: setup-node
      name: Setup Node.js
      uses: actions/setup-node@v4
      
    - id: setup-libraries
      name: Install libraries
      run: |
        npm install -g zapier-platform-cli@latest
        yarn install
    - name: Check Zapier CLI version
      run: zapier -v
    
    - id: zapier-validate
      name: Zapier validate
      run: zapier validate
